<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Conversational Form</title>
  <script src="https://cdn.jsdelivr.net/gh/space10-community/conversational-form@1.0.1/dist/conversational-form.min.js"></script>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
    }

    #cf-context {
      width: 100%;
      height: 100vh;
    }
  </style>
</head>
<body>

  <div id="cf-context"></div>

  <form id="my-form" style="display:none;">
    <input type="text" name="name" cf-questions="Vad heter du?" required />
    <input type="email" name="email" cf-questions="Vad är din e-post?" required />

    <select name="topic" cf-questions="Vad gäller din förfrågan?" required>
      <option value="brand">Varumärke</option>
      <option value="web">Webb</option>
      <option value="strategy">Strategi</option>
    </select>

    <button type="submit">Skicka</button>
  </form>

  <script>
    window.addEventListener("load", function () {
      new window.ConversationalForm({
        formEl: document.getElementById("my-form"),
        context: document.getElementById("cf-context")
      });
    });
  </script>

</body>
</html>
